# Semantic map for the unitree_go2_ros2_jazzy (junior_ctrl, real-walking) robot on its
# default.sdf world.
#
# 2026-08-25: deliberately does NOT list default.sdf's landmark objects (box1/2/3,
# cylinder1/2) as named places anymore, even though their positions are known (they
# were hand-authored here 2026-08-23 through 2026-08-24 while building the camera +
# YOLO-World detection pipeline). The user wants the agent to have *only* the map --
# no pre-baked object knowledge -- and use get_map_overview()/rotate()/
# navigate_to_point()/list_detected_objects() to actually find things when asked
# what's in the room.
# Pre-listing the objects here defeated that entirely: the agent would just offer the
# known names instead of looking. Only generic, non-object navigation reference points
# stay here. See PROGRESS.md Session 12 (cont'd) and go2_world.sdf/default.sdf for the
# objects' real positions if a future session needs them for some other reason (e.g.
# re-verifying detection accuracy).
places:
  waypoint:
    x: 0.9
    y: 0.6
    yaw: 0.0
    description: "A short walk from the start point -- the tested, known-reachable spot."
  start:
    x: 0.0
    y: 0.0
    yaw: 0.0
    description: "Where the robot stood up at the beginning of the run."
